<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghost Lab SOC</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0e1117;
      --sidebar:   #161b25;
      --surface:   #1c2333;
      --border:    #2a3448;
      --muted:     #8892a4;
      --text:      #e2e8f0;
      --operator:  #60a5fa;

      --red:    #f87171;
      --red-bg: #2a1515;
      --blue:   #38bdf8;
      --blue-bg:#0f2233;
      --green:  #4ade80;
      --green-bg:#0f2a1a;
      --purple: #c084fc;
      --purple-bg:#1e1033;

      --radius: 12px;
      --font: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --mono: 'SF Mono', 'Fira Code', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    aside {
      width: 260px;
      min-width: 260px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .logo {
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--border);
    }
    .logo h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text);
    }
    .logo span { color: var(--muted); font-size: 11px; display: block; margin-top: 2px; }

    .nav-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 16px 16px 6px;
    }

    .agent-list { flex: 1; overflow-y: auto; padding: 4px 8px; }

    .agent-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      text-align: left;
      font-size: 13px;
      font-family: var(--font);
      transition: background 0.15s, color 0.15s;
      position: relative;
    }
    .agent-btn:hover { background: var(--surface); color: var(--text); }
    .agent-btn.active { background: var(--surface); color: var(--text); }

    .agent-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .agent-btn .badge {
      margin-left: auto;
      background: var(--red);
      color: #000;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 10px;
      display: none;
    }
    .agent-btn.has-new .badge { display: block; }

    .dot-all    { background: var(--text); }
    .dot-red    { background: var(--red); }
    .dot-blue   { background: var(--blue); }
    .dot-green  { background: var(--green); }
    .dot-purple { background: var(--purple); }
    .dot-op     { background: var(--operator); }

    /* Stats panel */
    .stats {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 16px;
    }
    .stat { text-align: center; flex: 1; }
    .stat-n { font-size: 18px; font-weight: 700; color: var(--text); font-family: var(--mono); }
    .stat-l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

    /* ── MAIN ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--sidebar);
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 15px;
    }
    .header-sub { color: var(--muted); font-size: 12px; margin-top: 1px; }

    .header-actions { display: flex; gap: 8px; }
    .btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      font-family: var(--font);
      transition: background 0.15s;
    }
    .btn:hover { background: var(--border); }
    .btn-primary {
      background: var(--operator);
      color: #000;
      border-color: var(--operator);
      font-weight: 600;
    }
    .btn-primary:hover { opacity: 0.85; }

    /* ── MESSAGES ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scroll-behavior: smooth;
    }

    .day-divider {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      padding: 12px 0 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .day-divider::before, .day-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .msg-group { margin-bottom: 2px; }

    .msg {
      display: flex;
      gap: 10px;
      padding: 3px 0;
      max-width: 100%;
    }
    .msg.from-operator { flex-direction: row-reverse; }

    .avatar {
      width: 30px; height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .bubble {
      max-width: 72%;
      padding: 10px 14px;
      border-radius: var(--radius);
      line-height: 1.55;
      word-break: break-word;
    }

    .msg-meta {
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Agent-specific bubbles */
    .from-red-team .bubble    { background: var(--red-bg); border: 1px solid #4a2020; color: var(--text); }
    .from-blue-team .bubble   { background: var(--blue-bg); border: 1px solid #0f3a50; color: var(--text); }
    .from-green-team .bubble  { background: var(--green-bg); border: 1px solid #1a4a2a; color: var(--text); }
    .from-purple-team .bubble { background: var(--purple-bg); border: 1px solid #2e1a4a; color: var(--text); }
    .from-operator .bubble    { background: #1a2a4a; border: 1px solid #2a4a70; color: var(--text); }

    .avatar-red    { background: var(--red-bg); color: var(--red); border: 1px solid #4a2020; }
    .avatar-blue   { background: var(--blue-bg); color: var(--blue); border: 1px solid #0f3a50; }
    .avatar-green  { background: var(--green-bg); color: var(--green); border: 1px solid #1a4a2a; }
    .avatar-purple { background: var(--purple-bg); color: var(--purple); border: 1px solid #2e1a4a; }
    .avatar-op     { background: #1a2a4a; color: var(--operator); border: 1px solid #2a4a70; }

    .sender-name {
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .from-red-team .sender-name    { color: var(--red); }
    .from-blue-team .sender-name   { color: var(--blue); }
    .from-green-team .sender-name  { color: var(--green); }
    .from-purple-team .sender-name { color: var(--purple); }
    .from-operator .sender-name    { color: var(--operator); }

    /* Markdown inside bubbles */
    .bubble h1,.bubble h2,.bubble h3 { font-size: 13px; font-weight: 700; margin: 8px 0 4px; color: var(--text); }
    .bubble p { margin: 4px 0; }
    .bubble ul,.bubble ol { padding-left: 18px; margin: 4px 0; }
    .bubble li { margin: 2px 0; }
    .bubble code {
      background: rgba(0,0,0,0.3);
      border-radius: 4px;
      padding: 1px 5px;
      font-family: var(--mono);
      font-size: 12px;
      color: #a8d8a8;
    }
    .bubble pre {
      background: rgba(0,0,0,0.4);
      border-radius: 6px;
      padding: 10px;
      overflow-x: auto;
      margin: 6px 0;
    }
    .bubble pre code { background: none; padding: 0; color: #a8d8a8; }
    .bubble strong { color: #fff; }
    .bubble table { border-collapse: collapse; width: 100%; margin: 6px 0; font-size: 12px; }
    .bubble th { background: rgba(0,0,0,0.3); padding: 5px 8px; text-align: left; border: 1px solid var(--border); }
    .bubble td { padding: 4px 8px; border: 1px solid var(--border); }

    /* ── COMPOSE ── */
    .compose-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--sidebar);
    }
    .compose-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .compose-inner {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .compose-inner:focus-within { border-color: var(--operator); }

    .to-row {
      padding: 8px 12px 0;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .to-row select {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 12px;
      font-family: var(--font);
      outline: none;
      cursor: pointer;
    }
    .to-row select option { background: var(--surface); }

    textarea {
      background: transparent;
      border: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      padding: 8px 12px 10px;
      resize: none;
      outline: none;
      min-height: 60px;
      max-height: 160px;
      width: 100%;
    }

    .send-btn {
      width: 40px; height: 40px;
      border-radius: 10px;
      border: none;
      background: var(--operator);
      color: #000;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }
    .send-btn:hover { opacity: 0.85; }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Empty state */
    .empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 8px;
    }
    .empty-icon { font-size: 32px; opacity: 0.4; }
    .empty-text { font-size: 13px; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Status dot */
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #4ade80;
      display: inline-block;
    }

    .loading { color: var(--muted); font-size: 12px; padding: 8px 0; text-align: center; }
  </style>
</head>
<body>

<aside>
  <div class="logo">
    <h1>👻 Ghost Lab SOC</h1>
    <span id="live-status">● Live</span>
  </div>

  <div class="nav-label">Channels</div>
  <div class="agent-list">
    <button class="agent-btn active" data-agent="all" onclick="switchAgent('all', this)">
      <span class="agent-dot dot-all"></span>
      All Messages
      <span class="badge" id="badge-all"></span>
    </button>
    <button class="agent-btn" data-agent="red-team" onclick="switchAgent('red-team', this)">
      <span class="agent-dot dot-red"></span>
      Red Team
      <span class="badge" id="badge-red-team"></span>
    </button>
    <button class="agent-btn" data-agent="blue-team" onclick="switchAgent('blue-team', this)">
      <span class="agent-dot dot-blue"></span>
      Blue Team
      <span class="badge" id="badge-blue-team"></span>
    </button>
    <button class="agent-btn" data-agent="green-team" onclick="switchAgent('green-team', this)">
      <span class="agent-dot dot-green"></span>
      Green Team
      <span class="badge" id="badge-green-team"></span>
    </button>
    <button class="agent-btn" data-agent="purple-team" onclick="switchAgent('purple-team', this)">
      <span class="agent-dot dot-purple"></span>
      Purple Team
      <span class="badge" id="badge-purple-team"></span>
    </button>
    <button class="agent-btn" data-agent="operator" onclick="switchAgent('operator', this)">
      <span class="agent-dot dot-op"></span>
      Operator (me)
      <span class="badge" id="badge-operator"></span>
    </button>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-n" id="stat-total">—</div>
      <div class="stat-l">Messages</div>
    </div>
    <div class="stat">
      <div class="stat-n" id="stat-agents">—</div>
      <div class="stat-l">Active</div>
    </div>
  </div>
</aside>

<main>
  <header>
    <div>
      <div class="header-title">
        <span class="agent-dot dot-all" id="header-dot"></span>
        <span id="header-title">All Messages</span>
      </div>
      <div class="header-sub" id="header-sub">All agent communications</div>
    </div>
    <div class="header-actions">
      <button class="btn" onclick="loadMessages()">↻ Refresh</button>
    </div>
  </header>

  <div id="chat"><div class="loading">Loading messages…</div></div>

  <div class="compose-area">
    <div class="compose-row">
      <div class="compose-inner">
        <div class="to-row">
          To:
          <select id="recipient-select">
            <option value="red-team">red-team</option>
            <option value="blue-team">blue-team</option>
            <option value="green-team">green-team</option>
            <option value="purple-team">purple-team</option>
            <option value="all">all agents</option>
          </select>
        </div>
        <textarea
          id="message-body"
          placeholder="Type a message…"
          onkeydown="handleKey(event)"
        ></textarea>
      </div>
      <button class="send-btn" onclick="sendMessage()" title="Send (Ctrl+Enter)">↑</button>
    </div>
  </div>
</main>

<script>
  let currentAgent = 'all';
  let allMessages = [];
  let lastSeenIds = new Set();
  let newCounts = {};

  const agentColors = {
    'red-team':    'red',
    'blue-team':   'blue',
    'green-team':  'green',
    'purple-team': 'purple',
    'operator':    'op',
  };

  const agentLabels = {
    'red-team':    'RT',
    'blue-team':   'BT',
    'green-team':  'GT',
    'purple-team': 'PT',
    'operator':    'OP',
  };

  const agentDescriptions = {
    'all':         'All agent communications',
    'red-team':    'Penetration testing & exploitation',
    'blue-team':   'Alert triage & incident response',
    'green-team':  'Detection engineering',
    'purple-team': 'Threat hunting',
    'operator':    'Your sent messages',
  };

  function formatTime(ts) {
    const d = new Date(ts);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function formatDate(ts) {
    const d = new Date(ts);
    const today = new Date();
    const yesterday = new Date(today);
    yesterday.setDate(today.getDate() - 1);
    if (d.toDateString() === today.toDateString()) return 'Today';
    if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  }

  function renderMarkdown(text) {
    // Strip JSON code fences for cleaner display
    let clean = text
      .replace(/```json\n?/g, '')
      .replace(/```\n?/g, '')
      .trim();
    try {
      return marked.parse(clean);
    } catch(e) {
      return clean.replace(/\n/g, '<br>');
    }
  }

  function filterMessages(msgs) {
    if (currentAgent === 'all') return msgs;
    if (currentAgent === 'operator') return msgs.filter(m => m.sender === 'operator');
    return msgs.filter(m => m.sender === currentAgent || m.recipient === currentAgent);
  }

  function renderMessages(msgs) {
    const chat = document.getElementById('chat');
    const filtered = filterMessages(msgs);

    if (filtered.length === 0) {
      chat.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">No messages yet</div></div>`;
      return;
    }

    let html = '';
    let lastDate = '';

    filtered.forEach((msg, i) => {
      const dateStr = formatDate(msg.timestamp);
      if (dateStr !== lastDate) {
        html += `<div class="day-divider">${dateStr}</div>`;
        lastDate = dateStr;
      }

      const color = agentColors[msg.sender] || 'op';
      const label = agentLabels[msg.sender] || msg.sender.slice(0,2).toUpperCase();
      const isOp = msg.sender === 'operator';
      const bodyHtml = renderMarkdown(msg.body);
      const showSender = i === 0 || filtered[i-1].sender !== msg.sender;

      html += `
        <div class="msg from-${msg.sender}">
          <div class="avatar avatar-${color}">${label}</div>
          <div>
            ${showSender ? `<div class="sender-name">${msg.sender}${msg.recipient ? ` → ${msg.recipient}` : ''}</div>` : ''}
            <div class="bubble">${bodyHtml}</div>
            <div class="msg-meta">${formatTime(msg.timestamp)}</div>
          </div>
        </div>`;
    });

    chat.innerHTML = html;
    chat.scrollTop = chat.scrollHeight;
  }

  function updateStats(msgs) {
    const senders = new Set(msgs.map(m => m.sender));
    document.getElementById('stat-total').textContent = msgs.length;
    document.getElementById('stat-agents').textContent = senders.size;
  }

  function updateBadges(msgs) {
    const agents = ['red-team','blue-team','green-team','purple-team','operator'];
    agents.forEach(a => {
      const count = msgs.filter(m =>
        (m.sender === a || m.recipient === a) && !lastSeenIds.has(m.id)
      ).length;
      const badge = document.getElementById(`badge-${a}`);
      const btn = document.querySelector(`[data-agent="${a}"]`);
      if (badge && count > 0 && a !== currentAgent) {
        badge.textContent = count > 9 ? '9+' : count;
        btn.classList.add('has-new');
      } else if (badge) {
        badge.textContent = '';
        btn.classList.remove('has-new');
      }
    });
  }

  async function loadMessages() {
    try {
      const res = await fetch('/messages');
      const msgs = await res.json();
      allMessages = msgs; // newest last for chronological display

      renderMessages(allMessages);
      updateStats(allMessages);
      updateBadges(allMessages);

      // Mark current view as seen
      filterMessages(allMessages).forEach(m => lastSeenIds.add(m.id));

    } catch(e) {
      console.error('Failed to load messages:', e);
    }
  }

  function switchAgent(agent, btn) {
    currentAgent = agent;
    document.querySelectorAll('.agent-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    // Update header
    const dotClass = {
      'all':'dot-all','red-team':'dot-red','blue-team':'dot-blue',
      'green-team':'dot-green','purple-team':'dot-purple','operator':'dot-op'
    }[agent] || 'dot-all';
    document.getElementById('header-dot').className = `agent-dot ${dotClass}`;
    document.getElementById('header-title').textContent =
      agent === 'all' ? 'All Messages' :
      agent === 'operator' ? 'Operator' :
      agent.split('-').map(w => w[0].toUpperCase()+w.slice(1)).join(' ');
    document.getElementById('header-sub').textContent = agentDescriptions[agent] || '';

    // Clear badge
    const badge = document.getElementById(`badge-${agent}`);
    const agentBtn = document.querySelector(`[data-agent="${agent}"]`);
    if (badge) { badge.textContent = ''; agentBtn.classList.remove('has-new'); }

    // Pre-select recipient in compose
    const sel = document.getElementById('recipient-select');
    if (agent !== 'all' && agent !== 'operator') sel.value = agent;

    renderMessages(allMessages);
    filterMessages(allMessages).forEach(m => lastSeenIds.add(m.id));
  }

  async function sendMessage() {
    const body = document.getElementById('message-body').value.trim();
    const recipient = document.getElementById('recipient-select').value;
    if (!body || !recipient) return;

    const btn = document.querySelector('.send-btn');
    btn.disabled = true;

    try {
      await fetch('/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sender: 'operator', recipient, body })
      });
      document.getElementById('message-body').value = '';
      await loadMessages();
    } catch(e) {
      console.error('Send failed:', e);
    }

    btn.disabled = false;
  }

  function handleKey(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      sendMessage();
    }
    // Auto-resize
    const ta = document.getElementById('message-body');
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 160) + 'px';
  }

  // Auto refresh every 15s
  loadMessages();
  setInterval(loadMessages, 15000);
</script>
</body>
</html>
